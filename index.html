<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 15 Test — Verb Tenses | Thầy Vũ Nguyên</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:16px}

/* Header */
.header{background:linear-gradient(135deg,#1e293b 0%,#334155 100%);border-radius:16px;padding:20px 24px;margin-bottom:20px;border:1px solid #334155;position:sticky;top:8px;z-index:100;backdrop-filter:blur(10px)}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:.8rem;color:#94a3b8;margin-top:2px}
.timer-box{display:flex;align-items:center;gap:8px;background:#1e1b4b;padding:8px 16px;border-radius:12px;font-weight:700;font-size:1.1rem;border:1px solid #4338ca}
.timer-box.warn{background:#7f1d1d;border-color:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.timer-icon{font-size:1.2rem}
.progress-bar{margin-top:12px;background:#1e293b;border-radius:8px;height:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:8px;transition:width .3s}
.progress-text{font-size:.75rem;color:#94a3b8;margin-top:4px;text-align:right}

/* Start screen */
.start-screen{text-align:center;padding:60px 20px}
.start-screen h2{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.start-screen p{color:#94a3b8;margin-bottom:6px;font-size:.95rem}
.start-screen .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:400px;margin:24px auto}
.info-card{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #334155}
.info-card .num{font-size:1.5rem;font-weight:800;color:#818cf8}
.info-card .label{font-size:.8rem;color:#94a3b8;margin-top:4px}
.input-group{max-width:400px;margin:24px auto}
.input-group input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:1rem;margin-bottom:8px}
.input-group input:focus{outline:none;border-color:#6366f1}
.btn-start{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;padding:14px 48px;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:16px;transition:transform .2s}
.btn-start:hover{transform:scale(1.03)}

/* Question */
.question-card{background:#1e293b;border-radius:16px;padding:24px;margin-bottom:16px;border:1px solid #334155;transition:border-color .3s}
.question-card.answered{border-color:#4338ca}
.question-card.correct{border-color:#22c55e}
.question-card.wrong{border-color:#ef4444}
.q-num{display:inline-block;background:#6366f1;color:#fff;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.q-section{display:inline-block;background:#7c3aed;color:#fff;font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;margin-left:6px;margin-bottom:10px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:16px;color:#f1f5f9}
.q-text .blank{color:#818cf8;font-weight:700;border-bottom:2px dashed #6366f1;padding:0 4px}
.options{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid #334155;cursor:pointer;transition:all .2s;background:#0f172a}
.opt:hover{border-color:#6366f1;background:#1e1b4b}
.opt.selected{border-color:#6366f1;background:#1e1b4b}
.opt.correct-answer{border-color:#22c55e;background:#052e16}
.opt.wrong-answer{border-color:#ef4444;background:#450a0a}
.opt-letter{min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#334155;font-weight:700;font-size:.8rem;flex-shrink:0}
.opt.selected .opt-letter{background:#6366f1;color:#fff}
.opt.correct-answer .opt-letter{background:#22c55e;color:#fff}
.opt.wrong-answer .opt-letter{background:#ef4444;color:#fff}
.opt-text{font-size:.95rem;line-height:1.4;padding-top:3px}
.opt[disabled]{pointer-events:none;opacity:.7}

/* Submit / Result */
.btn-submit{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:20px;transition:transform .2s}
.btn-submit:hover{transform:scale(1.02)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}

.result-screen{text-align:center;padding:40px 20px}
.score-circle{width:160px;height:160px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;border:6px solid}
.score-circle.excellent{border-color:#22c55e;background:#052e16}
.score-circle.good{border-color:#eab308;background:#422006}
.score-circle.fail{border-color:#ef4444;background:#450a0a}
.score-num{font-size:2.5rem;font-weight:800}
.score-label{font-size:.85rem;color:#94a3b8}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;max-width:500px;margin:20px auto}
.stat{background:#1e293b;border-radius:12px;padding:14px;border:1px solid #334155}
.stat .val{font-size:1.3rem;font-weight:700}
.stat .lbl{font-size:.75rem;color:#94a3b8;margin-top:2px}
.stat.green .val{color:#22c55e}
.stat.red .val{color:#ef4444}
.stat.blue .val{color:#818cf8}
.btn-review{background:#334155;color:#e2e8f0;border:none;padding:12px 32px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:20px}
.explanation{background:#1e1b4b;border-radius:8px;padding:12px;margin-top:12px;font-size:.85rem;line-height:1.5;color:#c4b5fd;display:none}
.show-exp .explanation{display:block}

.hidden{display:none}
@media(max-width:600px){.container{padding:10px}.header h1{font-size:1rem}.q-text{font-size:.92rem}}
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Start Screen -->
  <div id="s-start" class="start-screen">
    <h2>DAY 15 — TEST</h2>
    <p>Verb Tenses (9 Thì)</p>
    <p style="color:#64748b;font-size:.85rem">Thầy Vũ Nguyên — TOEIC Course</p>
    <div class="info-grid">
      <div class="info-card"><div class="num">35</div><div class="label">Câu hỏi</div></div>
      <div class="info-card"><div class="num">30</div><div class="label">Phút</div></div>
      <div class="info-card"><div class="num">3</div><div class="label">Phần</div></div>
      <div class="info-card"><div class="num">10</div><div class="label">Điểm tối đa</div></div>
    </div>
    <div class="input-group">
      <input type="text" id="i-name" placeholder="Họ và tên">
      <input type="text" id="i-class" placeholder="Lớp">
    </div>
    <button class="btn-start" onclick="startTest()">Bắt đầu làm bài</button>
  </div>

  <!-- Test Screen -->
  <div id="s-test" class="hidden">
    <div class="header" id="hdr">
      <div class="header-top">
        <div>
          <h1>Day 15 — Verb Tenses (9 Thì)</h1>
          <div class="sub" id="student-info"></div>
        </div>
        <div class="timer-box" id="timer-box">
          <span class="timer-icon">&#9202;</span>
          <span id="timer">30:00</span>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="progress-text" id="prog-text">0/35 câu đã trả lời</div>
    </div>

    <div id="questions"></div>

    <button class="btn-submit" id="btn-submit" onclick="submitTest()">Nộp bài</button>
  </div>

  <!-- Result Screen -->
  <div id="s-result" class="hidden"></div>
</div>

<script>
var QUESTIONS = [
  // ===== PHẦN 1: LÝ THUYẾT NGỮ PHÁP (10 câu) =====
  {section:"Lý thuyết ngữ pháp",q:"Công thức thì <b>hiện tại đơn</b> (chủ ngữ số ít) là:",opts:["S + V(bare)","S + V(s/es)","S + am/is/are + Ving","S + have/has + Vpp"],ans:1,exp:"HTĐ: S(số ít) + V(s/es). VD: He works every day."},
  {section:"Lý thuyết ngữ pháp",q:"Công thức thì <b>quá khứ hoàn thành</b> là:",opts:["S + have/has + Vpp","S + had + Vpp","S + was/were + Ving","S + Ved/V2"],ans:1,exp:"QKHT: S + had + Vpp. VD: I had eaten before I came here."},
  {section:"Lý thuyết ngữ pháp",q:"Dấu hiệu nào <b>KHÔNG</b> phải của thì hiện tại hoàn thành?",opts:["since","for","yesterday","recently"],ans:2,exp:"'Yesterday' là dấu hiệu của thì quá khứ đơn. HTHT dùng: since, for, already, yet, just, recently, so far..."},
  {section:"Lý thuyết ngữ pháp",q:"Trong câu có mệnh đề trạng ngữ thời gian (when, as soon as, before...), <b>mệnh đề chính</b> chia thì gì?",opts:["Hiện tại đơn","Tương lai đơn (will + V)","Quá khứ đơn","Hiện tại hoàn thành"],ans:1,exp:"MĐ chính → tương lai đơn (will + V). MĐ trạng ngữ → hiện tại đơn. VD: I will be happy when I get 900 TOEIC."},
  {section:"Lý thuyết ngữ pháp",q:"\"Be going to + V\" dùng để diễn tả:",opts:["Hành động không có kế hoạch, phát sinh tại chỗ","Hành động CÓ KẾ HOẠCH, CÓ DỰ ĐỊNH từ trước","Hành động đang xảy ra ở hiện tại","Hành động đã hoàn thành trong quá khứ"],ans:1,exp:"'Be going to' → có kế hoạch/dự định. 'Will' → không có kế hoạch, quyết định tại thời điểm nói."},
  {section:"Lý thuyết ngữ pháp",q:"Công thức thì <b>tương lai hoàn thành</b> là:",opts:["S + will + V","S + will be + Ving","S + will have + Vpp","S + have/has + Vpp"],ans:2,exp:"TLHT: S + will have + Vpp. VD: By next month, I will have finished the project."},
  {section:"Lý thuyết ngữ pháp",q:"\"By the time\" là dấu hiệu của thì nào?",opts:["Hiện tại hoàn thành","Quá khứ hoàn thành / Tương lai hoàn thành","Hiện tại tiếp diễn","Quá khứ đơn"],ans:1,exp:"'By the time' + mệnh đề → dấu hiệu QKHT hoặc TLHT. VD: I had eaten by the time she arrived."},
  {section:"Lý thuyết ngữ pháp",q:"Thì <b>hiện tại tiếp diễn</b> ngoài diễn tả hành động đang xảy ra, còn dùng để:",opts:["Diễn tả hành động đã hoàn thành","Diễn tả thói quen","Diễn tả hành động đã được lên kế hoạch từ trước","Diễn tả hành động xảy ra trong quá khứ xa"],ans:2,exp:"HTTD còn diễn tả hành động đã lên kế hoạch. VD: My boss is travelling to Australia next month."},
  {section:"Lý thuyết ngữ pháp",q:"Dấu hiệu \"every day, usually, often, always\" thuộc thì nào?",opts:["Hiện tại đơn","Hiện tại tiếp diễn","Quá khứ đơn","Hiện tại hoàn thành"],ans:0,exp:"Every day, usually, often, always → dấu hiệu thì hiện tại đơn (thói quen, sự thật)."},
  {section:"Lý thuyết ngữ pháp",q:"Công thức thì <b>quá khứ tiếp diễn</b> là:",opts:["S + Ved/V2","S + was/were + Ving","S + had + Vpp","S + have/has + Vpp"],ans:1,exp:"QKTD: S + was/were + Ving. VD: They were working when I arrived."},

  // ===== PHẦN 2: CHỌN DẠNG ĐÚNG CỦA ĐỘNG TỪ (15 câu) =====
  {section:"Chia động từ",q:"The traffic lights _______ working last night because of the heavy snow.",opts:["stop","stops","stopped","to stop"],ans:2,exp:"'Last night' → quá khứ đơn → stopped."},
  {section:"Chia động từ",q:"The department usually _______ with customer complaints related to our products.",opts:["deal","deals","dealt","will deal"],ans:1,exp:"'Usually' + chủ ngữ 'The department' (số ít) → HTĐ → deals."},
  {section:"Chia động từ",q:"Officials will conduct a press conference as soon as they _______ more information.",opts:["gathers","gather","will gather","gathered"],ans:1,exp:"Mệnh đề trạng ngữ (as soon as) → chia HTĐ. Chủ ngữ 'they' → gather."},
  {section:"Chia động từ",q:"The director will be very satisfied when she _______ her plans.",opts:["will present","have present","presenting","presents"],ans:3,exp:"MĐ trạng ngữ (when) → HTĐ. Chủ ngữ 'she' (số ít) → presents."},
  {section:"Chia động từ",q:"Simpson Manufacturing _______ seasonal workers for its new product line.",opts:["hire","hires","is hiring","hired"],ans:2,exp:"Hành động đang xảy ra ở hiện tại → HTTD → is hiring."},
  {section:"Chia động từ",q:"Daily guided tours of the National Museum _______ at 2 P.M on the second floor.",opts:["begin","begins","is beginning","began"],ans:0,exp:"Lịch trình cố định → HTĐ. Chủ ngữ 'tours' (số nhiều) → begin."},
  {section:"Chia động từ",q:"The factory's productivity _______ since the introduction of the new manufacturing system.",opts:["improves","improved","has improved","had improved"],ans:2,exp:"'Since' → dấu hiệu HTHT → has improved."},
  {section:"Chia động từ",q:"Fashion, Inc. _______ the order before Ms. Chu requested that it be canceled.",opts:["already ships","is already shipping","had already shipped","will already ship"],ans:2,exp:"Hành động xảy ra TRƯỚC quá khứ (before Ms. Chu requested) → QKHT → had already shipped."},
  {section:"Chia động từ",q:"The researchers _______ hard to develop a perfect new model over the last 2 years.",opts:["work","worked","are working","have been working"],ans:3,exp:"'Over the last 2 years' → HTHT tiếp diễn → have been working."},
  {section:"Chia động từ",q:"The city council _______ to increase funding for community sports facilities.",opts:["to decide","are deciding","to have decided","has decided"],ans:3,exp:"'The city council' (số ít) + hành động đã xảy ra → HTHT → has decided."},
  {section:"Chia động từ",q:"Last month, the coordinator _______ all the supervisors of the changes in policy.",opts:["inform","informs","informed","has informed"],ans:2,exp:"'Last month' → quá khứ đơn → informed."},
  {section:"Chia động từ",q:"The only grocery store in this town is temporarily closed because it _______ a renovation.",opts:["undergo","is undergoing","have undergone","will have undergone"],ans:1,exp:"Hành động đang diễn ra ở hiện tại → HTTD → is undergoing."},
  {section:"Chia động từ",q:"By the end of this year, the Personnel manager _______ the employee reviews.",opts:["completes","completed","will complete","will have completed"],ans:3,exp:"'By the end of this year' → TLHT → will have completed."},
  {section:"Chia động từ",q:"Currently, MNH Co. _______ for producers for its New York station.",opts:["looks","looked","is looking","had looked"],ans:2,exp:"'Currently' → HTTD → is looking."},
  {section:"Chia động từ",q:"This commercial _______ a lot of new customers since its release last January.",opts:["attracts","will attract","have attracted","has attracted"],ans:3,exp:"'Since' → HTHT. 'This commercial' (số ít) → has attracted."},

  // ===== PHẦN 3: TỪ VỰNG (10 câu) =====
  {section:"Từ vựng",q:"\"state-of-the-art\" có nghĩa là:",opts:["Thuộc về nghệ thuật","Hiện đại nhất, tối tân","Cổ điển, truyền thống","Đắt tiền, xa xỉ"],ans:1,exp:"state-of-the-art (adj) = hiện đại nhất, tối tân. VD: state-of-the-art equipment."},
  {section:"Từ vựng",q:"\"undergo\" có nghĩa là:",opts:["Đi phía dưới","Trải qua, chịu đựng","Hiểu rõ","Ký kết hợp đồng"],ans:1,exp:"undergo (v) = trải qua. VD: The store is undergoing a renovation."},
  {section:"Từ vựng",q:"\"fulfill\" có nghĩa là:",opts:["Điền vào đầy đủ","Hoàn thành, đáp ứng","Cảm thấy thoải mái","Thất bại nặng nề"],ans:1,exp:"fulfill (v) = hoàn thành, đáp ứng. VD: Please let me know if you can fulfill my requests."},
  {section:"Từ vựng",q:"\"funding\" có nghĩa là:",opts:["Nền tảng cơ sở","Quỹ, nguồn tài trợ","Sự phát hiện","Niềm vui thú"],ans:1,exp:"funding (n) = quỹ, nguồn tài trợ. VD: increase funding for sports facilities."},
  {section:"Từ vựng",q:"\"transfer\" trong ngữ cảnh công việc có nghĩa là:",opts:["Chuyển tiền ngân hàng","Chuyển công tác","Vận chuyển hàng hóa","Phiên dịch tài liệu"],ans:1,exp:"transfer (v) = chuyển công tác. VD: Ms. Cole will be transferred to the London headquarters."},
  {section:"Từ vựng",q:"\"productivity\" có nghĩa là:",opts:["Sản phẩm","Năng suất","Sự sản xuất","Lợi nhuận"],ans:1,exp:"productivity (n) = năng suất. VD: The factory's productivity has improved."},
  {section:"Từ vựng",q:"\"drastically\" có nghĩa là:",opts:["Từ từ, chậm rãi","Mạnh mẽ, đáng kể","Nhẹ nhàng, tinh tế","Thường xuyên"],ans:1,exp:"drastically (adv) = mạnh mẽ, đáng kể. VD: Sales have drastically increased."},
  {section:"Từ vựng",q:"\"promising\" có nghĩa là:",opts:["Hứa hẹn, cam kết","Đầy hứa hẹn, triển vọng","Đáng thất vọng","Đang bận rộn"],ans:1,exp:"promising (adj) = đầy hứa hẹn. VD: She is a promising young employee."},
  {section:"Từ vựng",q:"\"conduct\" có nghĩa là:",opts:["Chỉ huy dàn nhạc","Tiến hành, thực hiện","Dẫn điện","Hành vi xấu"],ans:1,exp:"conduct (v) = tiến hành, thực hiện. VD: Officials will conduct a press conference."},
  {section:"Từ vựng",q:"\"opening\" trong ngữ cảnh tuyển dụng có nghĩa là:",opts:["Buổi khai trương","Vị trí đang tuyển","Lỗ hổng, khe hở","Cơ hội đầu tư"],ans:1,exp:"opening (n) = vị trí tuyển dụng đang mở. VD: We have an opening for a technical support representative."}
];

var studentName='',studentClass='',answers=[],timerInterval,timeLeft=30*60,testStarted=false;

function startTest(){
  studentName=document.getElementById('i-name').value.trim();
  studentClass=document.getElementById('i-class').value.trim();
  if(!studentName){alert('Vui lòng nhập họ tên!');return}
  document.getElementById('s-start').classList.add('hidden');
  document.getElementById('s-test').classList.remove('hidden');
  document.getElementById('student-info').textContent=studentName+(studentClass?' — '+studentClass:'');
  answers=new Array(QUESTIONS.length).fill(-1);
  renderQuestions();
  startTimer();
  testStarted=true;
}

function renderQuestions(){
  var html='';
  var lastSection='';
  QUESTIONS.forEach(function(q,i){
    if(q.section!==lastSection){
      lastSection=q.section;
      var sectionTitle='';
      if(q.section==='Lý thuyết ngữ pháp') sectionTitle='PHẦN 1: LÝ THUYẾT NGỮ PHÁP (10 câu)';
      else if(q.section==='Chia động từ') sectionTitle='PHẦN 2: CHỌN DẠNG ĐÚNG CỦA ĐỘNG TỪ (15 câu)';
      else if(q.section==='Từ vựng') sectionTitle='PHẦN 3: TỪ VỰNG (10 câu)';
      html+='<div style="margin:28px 0 16px;padding:12px 16px;background:linear-gradient(135deg,#312e81,#4c1d95);border-radius:12px;font-weight:700;font-size:.95rem">'+sectionTitle+'</div>';
    }

    var letters=['A','B','C','D'];
    html+='<div class="question-card" id="qc-'+i+'">'
      +'<span class="q-num">Câu '+(i+1)+'</span>'
      +'<span class="q-section">'+q.section+'</span>'
      +'<div class="q-text">'+q.q+'</div>'
      +'<div class="options">';
    q.opts.forEach(function(o,j){
      html+='<div class="opt" id="opt-'+i+'-'+j+'" onclick="selectAnswer('+i+','+j+')">'
        +'<div class="opt-letter">'+letters[j]+'</div>'
        +'<div class="opt-text">'+o+'</div></div>';
    });
    html+='</div>'
      +'<div class="explanation" id="exp-'+i+'">'+q.exp+'</div>'
      +'</div>';
  });
  document.getElementById('questions').innerHTML=html;
}

function selectAnswer(qi,oi){
  if(!testStarted) return;
  for(var j=0;j<4;j++){
    var el=document.getElementById('opt-'+qi+'-'+j);
    if(el) el.classList.remove('selected');
  }
  document.getElementById('opt-'+qi+'-'+oi).classList.add('selected');
  document.getElementById('qc-'+qi).classList.add('answered');
  answers[qi]=oi;
  updateProgress();
}

function updateProgress(){
  var answered=answers.filter(function(a){return a>=0}).length;
  var pct=Math.round(answered/QUESTIONS.length*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=answered+'/'+QUESTIONS.length+' câu đã trả lời';
}

function startTimer(){
  timerInterval=setInterval(function(){
    timeLeft--;
    if(timeLeft<=0){clearInterval(timerInterval);submitTest();return}
    var m=Math.floor(timeLeft/60);
    var s=timeLeft%60;
    document.getElementById('timer').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    if(timeLeft<=300) document.getElementById('timer-box').classList.add('warn');
  },1000);
}

function submitTest(){
  if(!testStarted) return;
  var unanswered=answers.filter(function(a){return a<0}).length;
  if(unanswered>0 && timeLeft>0){
    if(!confirm('Bạn còn '+unanswered+' câu chưa trả lời. Nộp bài?')) return;
  }
  clearInterval(timerInterval);
  testStarted=false;

  var correct=0,wrong=0,skipped=0;
  QUESTIONS.forEach(function(q,i){
    var card=document.getElementById('qc-'+i);
    if(answers[i]<0){skipped++;return}
    if(answers[i]===q.ans){
      correct++;
      card.classList.add('correct','show-exp');
      document.getElementById('opt-'+i+'-'+q.ans).classList.add('correct-answer');
    } else {
      wrong++;
      card.classList.add('wrong','show-exp');
      document.getElementById('opt-'+i+'-'+answers[i]).classList.add('wrong-answer');
      document.getElementById('opt-'+i+'-'+q.ans).classList.add('correct-answer');
    }
    for(var j=0;j<4;j++){
      var el=document.getElementById('opt-'+i+'-'+j);
      if(el) el.setAttribute('disabled','true');
      el.style.pointerEvents='none';
    }
  });

  var score=(correct/QUESTIONS.length*10).toFixed(1);
  var timeUsed=30*60-timeLeft;
  var mUsed=Math.floor(timeUsed/60);
  var sUsed=timeUsed%60;
  var grade=score>=8?'excellent':score>=5?'good':'fail';

  var resultHTML='<div class="result-screen">'
    +'<h2 style="font-size:1.5rem;margin-bottom:16px">Kết quả bài test</h2>'
    +'<div class="score-circle '+grade+'">'
    +'<div class="score-num">'+score+'</div>'
    +'<div class="score-label">/ 10 điểm</div></div>'
    +'<p style="font-size:1.1rem;margin-bottom:4px">'+studentName+(studentClass?' — '+studentClass:'')+'</p>'
    +'<p style="color:#94a3b8;font-size:.85rem">Thời gian: '+mUsed+' phút '+sUsed+' giây</p>'
    +'<div class="result-stats">'
    +'<div class="stat green"><div class="val">'+correct+'</div><div class="lbl">Đúng</div></div>'
    +'<div class="stat red"><div class="val">'+wrong+'</div><div class="lbl">Sai</div></div>'
    +'<div class="stat blue"><div class="val">'+skipped+'</div><div class="lbl">Bỏ qua</div></div>'
    +'</div>'
    +'<button class="btn-review" onclick="scrollToReview()">Xem lại bài làm ↓</button>'
    +'</div>';
  document.getElementById('s-result').innerHTML=resultHTML;
  document.getElementById('s-result').classList.remove('hidden');
  document.getElementById('btn-submit').classList.add('hidden');

  window.scrollTo({top:0,behavior:'smooth'});
}

function scrollToReview(){
  document.getElementById('questions').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
